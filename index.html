<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nutrition</title>
  <meta name="description" content="Suivi nutritionnel : objectif du jour selon l'entraînement, journal et calcul des quantités.">
  <meta name="theme-color" content="#0b5d3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nutrition">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="top">
    <div class="datebar" id="datebar">
      <button class="nav-arrow" data-shift="-1" aria-label="Jour précédent">◀</button>
      <button class="date-label" id="date-label" aria-label="Revenir à aujourd'hui"></button>
      <button class="nav-arrow" data-shift="1" aria-label="Jour suivant">▶</button>
    </div>
    <h1 id="page-title" hidden></h1>
  </header>

  <main id="view"><p class="loading">Chargement…</p></main>

  <nav id="tabs">
    <a href="#jour" data-tab="jour"><span class="ico">📅</span>Jour</a>
    <a href="#seance" data-tab="seance"><span class="ico">🏃</span>Séance</a>
    <a href="#repas" data-tab="repas"><span class="ico">🍽️</span>Repas</a>
    <a href="#aliments" data-tab="aliments"><span class="ico">🥕</span>Aliments</a>
    <a href="#reglages" data-tab="reglages"><span class="ico">⚙️</span>Réglages</a>
  </nav>

  <div id="sheet" hidden>
    <div class="sheet-backdrop" data-close-sheet></div>
    <div class="sheet-panel">
      <button class="sheet-close" data-close-sheet aria-label="Fermer">✕</button>
      <div class="sheet-body"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
